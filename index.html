<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music_action_lab v4</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; color: #ddd; font-family: sans-serif; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #overlay { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; }
      #overlay > * { pointer-events: auto; }
      .panel { background: rgba(16, 16, 20, 0.92); border: 1px solid #444; border-radius: 10px; padding: 20px 24px; max-width: 640px; width: calc(100vw - 32px); box-sizing: border-box; }
      .panel h1 { font-size: 20px; margin: 0 0 8px; }
      .panel p { margin: 6px 0; font-size: 14px; line-height: 1.5; }
      .panel .choice { display: flex; gap: 12px; margin: 12px 0; }
      .panel .choice > div { flex: 1; border: 2px solid #444; border-radius: 8px; padding: 10px; font-size: 13px; cursor: pointer; }
      .panel .choice > div.selected { border-color: #ffe066; background: rgba(255, 224, 102, 0.08); }
      .panel button { font-size: 16px; padding: 10px 20px; border-radius: 8px; border: none; background: #3a7; color: #fff; cursor: pointer; margin-right: 8px; }
      .panel pre { font-size: 12px; line-height: 1.4; white-space: pre-wrap; background: #000; padding: 10px; border-radius: 6px; max-height: 50vh; overflow: auto; }
      .hint { color: #ffb366; }
      .muted { color: #999; }
      .tuning { margin: 10px 0 14px; font-size: 13px; color: #999; }
      .tuning summary { cursor: pointer; }
      .tuning p { font-size: 13px; }
      .tuning .tuning-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      .tuning .tuning-label { flex: 0 0 11em; }
      .tuning input[type="range"] { flex: 1 1 auto; width: 100%; min-width: 0; margin: 0; }
      .tuning .tuning-value { flex: 0 0 3.5em; text-align: right; color: #ddd; font-variant-numeric: tabular-nums; }
      .panel button.tuning-reset { font-size: 13px; padding: 4px 10px; background: #444; color: #ddd; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
