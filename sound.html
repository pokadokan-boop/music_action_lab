<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音作り (v6)</title>
    <style>
      html, body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
      #app { padding: 16px; max-width: 980px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      h2 { font-size: 15px; margin: 18px 0 6px; color: #ccc; }
      p { font-size: 13px; line-height: 1.5; margin: 4px 0; }
      .muted { color: #999; }
      .hint { color: #ffb366; }
      button { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: none; background: #3a7; color: #fff; cursor: pointer; margin: 2px 6px 2px 0; }
      button.sub { background: #444; color: #ddd; }
      button.danger { background: #a44; }
      select, input[type="number"] { font-size: 13px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 3px 6px; }
      .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; flex-wrap: wrap; }
      .names { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      .names button { background: #333; color: #ddd; }
      .names button.selected { background: #ffe066; color: #222; }
      .layer { border: 1px solid #444; border-radius: 8px; padding: 8px 12px; margin: 8px 0; background: #16161c; }
      .layer .head { display: flex; align-items: center; gap: 10px; }
      .param { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; }
      .param label { flex: 0 0 11em; color: #bbb; }
      .param input[type="range"] { flex: 1 1 auto; min-width: 0; margin: 0; }
      .param .val { flex: 0 0 5em; text-align: right; color: #ddd; font-variant-numeric: tabular-nums; }
      textarea { width: 100%; box-sizing: border-box; height: 200px; background: #000; color: #ccc; font-size: 12px; border: 1px solid #444; border-radius: 6px; padding: 8px; }
      canvas { width: 100%; height: 120px; background: #000; border: 1px solid #333; border-radius: 6px; display: block; }
    </style>
  </head>
  <body>
    <div id="app">音作り (準備中)</div>
    <script type="module" src="/src/sound.ts"></script>
  </body>
</html>
